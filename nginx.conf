server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # formulário -> serviço de envio SMTP (resolução tardia: o site não cai se ele estiver parado)
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mailer http://jarvis-mail:3000;
    proxy_pass $mailer;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_read_timeout 30s;
    client_max_body_size 32k;
  }

  # Frames, imagens e áudio: cache longo (os nomes não mudam sem nova versão)
  location ~* \.(webp|png|jpg|jpeg|mp3)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  # código do site: o navegador sempre pergunta se mudou (ETag), então atualização chega na hora
  location ~* \.(css|js)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
